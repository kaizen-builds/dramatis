name: dramatis
label: Dramatis
version: "1.0.0"
description: >
  Spoiler-safe reading companion. Open a local EPUB, remember how far
  you have read, and ask who someone is. Answers come only from text at
  or before that position, with a short quote.
author: Dramatis contributors
license: MIT
requires_hermes: ">=0.21.6"
provides_tools:
  - open_book
  - set_progress
  - who_is
  - ask_book
  - list_cast
tags:
  - books
  - reading
